<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>📋 Smart Kanban</h1>
        <button id="add-task-btn" class="btn btn-primary">+ New Task</button>
    </header>

    <main class="board">
        <section class="column" data-column="todo">
            <div class="column-header">
                <h2>To Do</h2>
                <span class="task-count" id="count-todo">0</span>
            </div>
            <div class="task-list" id="todo-list" data-column="todo"></div>
        </section>

        <section class="column" data-column="inprogress">
            <div class="column-header">
                <h2>In Progress</h2>
                <span class="task-count" id="count-inprogress">0</span>
            </div>
            <div class="task-list" id="inprogress-list" data-column="inprogress"></div>
        </section>

        <section class="column" data-column="completed">
            <div class="column-header">
                <h2>Completed</h2>
                <span class="task-count" id="count-completed">0</span>
            </div>
            <div class="task-list" id="completed-list" data-column="completed"></div>
        </section>
    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">New Task</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-title">Title *</label>
                    <input type="text" id="task-title" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" maxlength="500"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="normal">Normal</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-due">Due Date</label>
                        <input type="date" id="task-due">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="delete-task-btn" class="btn btn-danger hidden">Delete</button>
                    <div class="spacer"></div>
                    <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
